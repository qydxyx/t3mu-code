name: Privacy regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: privacy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  privacy:
    if: github.repository == 'qydxyx/t3mu-code'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DO_NOT_TRACK: "1"
      EXPO_NO_TELEMETRY: "1"
      CLERK_TELEMETRY_DISABLED: "1"
      OTEL_SDK_DISABLED: "true"
      T3CODE_OTEL_SDK_DISABLED: "true"
      T3CODE_TELEMETRY_ENABLED: "false"
      T3_TASK_CACHE_TELEMETRY: "off"
      VP_REMOTE_CACHE: "off"
      npm_config_ignore_scripts: "true"
    steps:
      # checkout's persist-credentials:false cleanup traverses malformed upstream gitlinks.
      # This repository is public: fetch the event SHA without ANY checkout credential.
      - name: Public credential-free checkout of the exact event commit
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          [[ "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin https://github.com/qydxyx/t3mu-code.git
          git -c credential.helper= -c http.extraheader= -c core.hooksPath=/dev/null fetch --no-tags --no-recurse-submodules origin "$EVENT_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$EVENT_SHA"
          git -c core.hooksPath=/dev/null checkout --detach FETCH_HEAD
      - name: Check reviewed source before dependency installation
        run: |
          python3 privacy/check.py
          python3 -m unittest discover -s privacy -p 'test_*.py' -v
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - name: Install pinned package manager without lifecycle scripts
        run: npm install --global pnpm@12.14.0 --ignore-scripts
      - name: Install reviewed dependencies without lifecycle hooks
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - name: Telemetry contracts, lint and affected-package typechecks
        run: python3 privacy/verify.py
